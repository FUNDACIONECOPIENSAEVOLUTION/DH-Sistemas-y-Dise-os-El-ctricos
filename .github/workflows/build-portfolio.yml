name: Publicar imagenes optimizadas y portafolio PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/servicios/**'
      - 'assets/servicios-v2/**'
      - '.github/workflows/build-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install reportlab pillow
      - name: Optimizar fotografias para tarjetas
        run: python scripts/build_visual_assets.py
      - name: Generar portafolio
        run: python scripts/generate_portfolio.py
      - name: Publicar imagenes y PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/servicios-v2 docs/portafolio-dh-david-hernandez.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Optimizar imagenes y PDF del portafolio DH'
            git push
          fi
