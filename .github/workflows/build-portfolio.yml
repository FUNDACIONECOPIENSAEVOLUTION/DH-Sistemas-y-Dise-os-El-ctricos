name: Generar portafolio PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_portfolio.py'
      - 'assets/**'
      - '.github/workflows/build-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install reportlab pillow
      - name: Generar portafolio
        run: python scripts/generate_portfolio.py
      - name: Publicar PDF si hay cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/portafolio-dh-david-hernandez.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Generar portafolio PDF institucional'
            git push
          fi